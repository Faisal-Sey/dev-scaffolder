name: Create Executor Issues

on:
  workflow_dispatch:

jobs:
  create-issues:
    name: Create GitHub issues for each executor
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Create issues for all executors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXECUTORS_DIR="src/dev-scaffolder/executors"

          find "$EXECUTORS_DIR" -name "*.py" ! -name "__init__.py" | sort | while read filepath; do
            relative="${filepath#$EXECUTORS_DIR/}"
            category=$(echo "$relative" | cut -d'/' -f1)
            feature=$(basename "$filepath" .py)
            framework=$(echo "$relative" | rev | cut -d'/' -f2- | rev | cut -d'/' -f2-)
            title="Implement executor: $relative"

            existing=$(gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[0].title')
            if [ "$existing" = "$title" ]; then
              echo "SKIP (exists): $title"
              continue
            fi

            cat > /tmp/issue_body.md << BODY
          ## Executor: \`$feature\`

          **File:** \`$filepath\`
          **Category:** \`$category\`
          **Framework/Stack:** \`$framework\`

          ### Task
          Implement the \`generate_template\` function in \`$filepath\` so that it scaffolds a working \`$feature\` setup for a \`$framework\` project.

          ### Acceptance Criteria
          - [ ] \`generate_template\` produces the correct files/directories
          - [ ] Generated output is tested or manually verified
          - [ ] No placeholder \`print\` statements remain
          BODY

            gh issue create \
              --title "$title" \
              --body-file /tmp/issue_body.md \
              --label "executor,enhancement"

            echo "CREATED: $title"
          done
